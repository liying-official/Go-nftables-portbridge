# Required for nftables DNAT/SNAT of traffic received from other hosts.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# Allow Go-nftables-portbridge's per-socket UDP buffer requests to take effect. Linux may
# account up to roughly twice the requested SO_RCVBUF/SO_SNDBUF value.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Absorb short RX bursts before userspace workers drain their socket queues.
net.core.netdev_max_backlog = 65536
