name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27.1"
  GOTOOLCHAIN: local
  GOFLAGS: -mod=vendor
  GOWORK: "off"
  GOPROXY: "off"
  GOSUMDB: "off"
  GOENV: "off"

jobs:
  pages-demo:
    name: Static Pages demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check generated demo assets
        run: python3 scripts/build-pages-demo.py --check
      - name: Test browser-local simulation
        run: node scripts/test-pages-demo.mjs

  quality:
    name: Vet and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(go version)" = "go version go1.27.1 linux/amd64"
          go env GOTOOLCHAIN GOFLAGS GOWORK

      - name: Verify vendored dependency graph
        run: go list -mod=vendor ./...

      - name: Go vet
        run: go vet ./...

      - name: Run tests
        run: go test -count=1 -timeout=5m ./...

  race:
    name: Race detector
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Run race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=8m ./...

  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go 1.27.1
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.1"
          cache: true
          cache-dependency-path: go.sum

      - name: Build
        shell: bash
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p dist
          output="dist/go-nftables-portbridge-linux-${GOARCH}"
          go build \
            -trimpath \
            -ldflags="-s -w -buildid= -X main.version=${version}" \
            -o "$output" \
            ./cmd/portbridge
          file "$output" || true
          sha256sum "$output" | tee "${output}.sha256"

      - name: Upload unsigned CI build (not a Release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unsigned-ci-go-nftables-portbridge-linux-${{ matrix.arch }}
          path: |
            dist/go-nftables-portbridge-linux-${{ matrix.arch }}
            dist/go-nftables-portbridge-linux-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 7
